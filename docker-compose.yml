services:
  app:
    build: .
    ports:
      - "3001:3000"
    restart: always
    environment:
      - NODE_ENV=development
    env_file:
      - .env.development
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: