<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crayfish - Community Posts</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .landing {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .landing h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    .landing p {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 2rem;
      max-width: 500px;
    }
    .landing-buttons {
      display: flex;
      gap: 1rem;
    }
    .landing-buttons a {
      padding: 0.75rem 2rem;
      text-decoration: none;
      border-radius: 5px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-login {
      background: #d4f000;
      color: #000;
      border: 2px solid #d4f000;
    }
    .btn-login:hover {
      background: #b8d900;
      border-color: #b8d900;
    }
    .btn-register {
      background: transparent;
      color: #000;
      border: 2px solid #000;
    }
    .btn-register:hover {
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="logo">Crayfish</a>
  </header>

  <main class="landing">
    <h1>Welcome to Crayfish</h1>
    <p>A community platform for sharing posts, discussions, and connecting with others.</p>
    <div class="landing-buttons">
      <a href="/login" class="btn-login">Log In</a>
      <a href="/register" class="btn-register">Register</a>
    </div>
  </main>
</body>
</html>
